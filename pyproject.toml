[build-system]
requires = ["Cython>=3.3.0", "meson-python"]
build-backend = "mesonpy"

[project]
name = "VapourSynth"
description = "A frameserver for the 21st century"
readme = "README.md"
requires-python = ">=3.12"
license = "LGPL-2.1-or-later"
license-files = ["COPYING.LESSER"]
authors = [{ name = "Fredrik Mellbin", email = "fredrik.mellbin@gmail.com" }]
keywords = ["frameserver", "video", "audio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Cython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://www.vapoursynth.com/"
Documentation = "https://www.vapoursynth.com/doc/"
Repository = "https://github.com/vapoursynth/vapoursynth.git"
Issues = "https://github.com/vapoursynth/vapoursynth/issues"
Changelog = "https://github.com/vapoursynth/vapoursynth/blob/master/ChangeLog"

[project.scripts]
vapoursynth = "vapoursynth._cli:main"
vspipe = "vapoursynth:vspipe"

[dependency-groups]
dev = ["build", { include-group = "doc" }]
doc = ["sphinx", "sphinx-intl", "sphinx-rtd-theme"]

[tool.meson-python]
limited-api = true

[tool.meson-python.wheel]
exclude = [
    "*.lib",
    "*/avscompat.pdb",
    "*/vapoursynth.pdb",
    "*/vspipe.pdb",
    "*/vsvfw.pdb",
]

[tool.cibuildwheel]
build-frontend = "uv"
build = ["cp314-win_amd64", "cp312-*", "cp315t-*"]
skip = ["cp312-win*", "*-win32"]
test-sources = ["test"]
test-command = [
    "vapoursynth config",
    "vapoursynth register-install",
    "vspipe --version",
    'python -m unittest discover -s test -p "*test.py"',
]

[tool.cibuildwheel.windows]
config-settings = { setup-args = ["--debug", "--vsenv"] }
environment = { CC = "clang-cl", CXX = "clang-cl", AR = "llvm-lib" }
repair-wheel-command = [
    "uvx wheel tags --remove --python-tag cp312 {wheel}",
    'move /y "{wheel}\..\*.whl" "{dest_dir}"',
]

[tool.cibuildwheel.linux]
test-command = 'python -m unittest discover -s test -p "*test.py"'

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

[[tool.cibuildwheel.overrides]]
select = "cp3??t-*"
config-settings = { setup-args = ["-Dpython.allow_limited_api=false"] }

[[tool.cibuildwheel.overrides]]
select = "cp3??t-win*"
config-settings = { setup-args = ["--debug", "--vsenv", "-Dpython.allow_limited_api=false"] }
repair-wheel-command = ""

[tool.ruff]
extend-exclude = ["vapoursynth.pyi"]
line-length = 120

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"test/environment_test.py" = ["F811", "F841"]
"test/weakref_test.py" = ["F841"]
"__init__.py" = ["F401", "F403", "F405"]
