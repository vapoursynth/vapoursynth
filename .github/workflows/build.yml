name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build-sdist:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v8.2.0

    - name: Build
      run: |
        uv build --sdist

    - uses: actions/upload-artifact@v7
      with:
        name: vapoursynth-sdist
        path: dist

  build-wheel:
    strategy:
      matrix:
        include:
        - arch: win_amd64
          runs-on: windows-2025-vs2026
        - arch: linux_x86_64
          runs-on: ubuntu-latest
        - arch: linux_aarch64
          runs-on: ubuntu-24.04-arm
        - arch: macosx_x86_64
          runs-on: macos-26-intel
        - arch: macosx_arm64
          runs-on: macos-26
      fail-fast: false

    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v10.0.1

    # The wheel builds with CC=clang-cl, and --vsenv doesn't put Visual Studio's own LLVM on
    # PATH, so clang-cl used to resolve to the image's standalone LLVM in C:\Program Files\LLVM.
    # That lags behind Visual Studio's STL, which refuses an older Clang than the one it ships
    # with (MSVC 14.52 wants Clang 22), so use the clang-cl and llvm-lib bundled with it.
    - name: Use Visual Studio's clang-cl
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
        if (-not $vs) { throw 'no Visual Studio with the C++ Clang component' }
        $llvm = Join-Path $vs 'VC\Tools\Llvm\x64\bin'
        & (Join-Path $llvm 'clang-cl.exe') --version
        if ($LASTEXITCODE -ne 0) { throw "clang-cl in $llvm did not run" }
        Add-Content -Path $env:GITHUB_PATH -Value $llvm

    - uses: pypa/cibuildwheel@v4.2.0
      with:
        output-dir: dist

    - uses: actions/upload-artifact@v7
      with:
        name: vapoursynth-${{ matrix.arch }}
        path: dist

    # The Windows wheel just built is the same one the installer and portable
    # packages ship, so package them here instead of recompiling the wheel in a
    # separate job. Everything below only runs on the Windows leg.
    - name: Install documentation tools
      if: ${{ runner.os == 'Windows' }}
      run: |
        py -3.14 -m ensurepip
        py -3.14 -m pip install --upgrade -r python-requirements.txt

    - name: Build docs and package installer and portable
      if: ${{ runner.os == 'Windows' }}
      shell: cmd
      env:
        SKIP_WAIT: '1'
      run: |
        call docs_build.bat
        cd installer
        call make_portable.bat
        call make_installers.bat

    - name: Check installer artifacts
      if: ${{ runner.os == 'Windows' }}
      run: |
        $dir = 'installer/Compiled'
        $exe = @(Get-ChildItem $dir -Filter *.exe -ErrorAction SilentlyContinue)
        $zip = @(Get-ChildItem $dir -Filter *.zip -ErrorAction SilentlyContinue)
        if ($exe.Count -lt 1) { throw 'installer .exe was not produced' }
        if ($zip.Count -lt 2) { throw "expected the two portable zips, found $($zip.Count)" }
        # Entry names are separated by forward slashes; a backslash is an ordinary
        # character in the name to every extractor that is not Windows, which is how
        # the releases once shipped directories called "wheel\vapoursynth-....whl".
        foreach ($z in $zip) {
          $archive = [System.IO.Compression.ZipFile]::OpenRead($z.FullName)
          $bad = @($archive.Entries | Where-Object { $_.FullName.Contains([char]92) })
          $archive.Dispose()
          if ($bad.Count -gt 0) { throw "$($z.Name): $($bad.Count) entries use backslash separators" }
        }
        Get-ChildItem $dir | Select-Object Name, Length

    - name: Upload installer and portable
      if: ${{ runner.os == 'Windows' }}
      uses: actions/upload-artifact@v7
      with:
        name: windows-installer
        path: installer/Compiled/*

    - name: Publish installer to release
      if: ${{ runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/R') }}
      uses: softprops/action-gh-release@v3
      with:
        files: installer/Compiled/*

  publish:
    permissions:
      id-token: write
    needs: [build-sdist, build-wheel]
    if: ${{ startsWith(github.ref, 'refs/tags/R') }}
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        pattern: vapoursynth-*
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@release/v1
